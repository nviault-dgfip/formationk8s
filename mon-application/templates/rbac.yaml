apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx-sa
  namespace: mon-application
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: mon-application
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods-global
  namespace: mon-application
subjects:
- kind: ServiceAccount
  name: nginx-sa
  namespace: mon-application
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
