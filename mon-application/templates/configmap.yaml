apiVersion: v1
kind: ConfigMap
metadata:
  name: mon-application-config
  namespace: mon-application
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="fr">
    <head>
      <meta charset="UTF-8">
      <title>Stagiaire - Déploiement NGINX</title>
      <style>
        body {font-family: Arial, sans-serif; text-align:center; margin-top:50px;}
        button {font-size:1.2rem; padding:10px 20px;}
        pre { text-align: left; display: inline-block; background: #f0f0f0; padding: 10px; }
      </style>
    </head>
    <body>
      <h1>Serveur NGINX déployé avec succès</h1>
      <p>Hôte accédé : <span id="podName">-</span></p>
      <button id="reportBtn">J’ai fini !</button>

      <script>
        document.getElementById('podName').innerText = location.hostname;

        document.getElementById('reportBtn').addEventListener('click', async () => {
          try {
            const resp = await fetch('/status', {method: 'GET'});
            if (!resp.ok) throw new Error('Erreur lors de la récupération du statut');
            const data = await resp.text();
            const trainerUrl = "{{ .Values.trainer.url }}?data=" + encodeURIComponent(data);
            await fetch(trainerUrl, {method: 'GET', mode: 'no-cors'});
            alert('Signal envoyé au formateur ! Merci.');
          } catch (e) {
            alert('Erreur d’envoi : ' + e);
          }
        });
      </script>
    </body>
    </html>

  default.conf: |
    server {
        listen       80;
        server_name  localhost;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        location /status {
            alias /data/status;
            default_type text/plain;
        }
    }

  collect-status.sh: |
    #!/bin/sh
    while true; do
      echo "--- Sortie de kubectl get pods -n mon-application ---" > /tmp/status.tmp
      kubectl get pods -n mon-application >> /tmp/status.tmp
      echo "" >> /tmp/status.tmp
      echo "--- Sortie de kubectl get svc -n mon-application ---" >> /tmp/status.tmp
      kubectl get svc -n mon-application >> /tmp/status.tmp
      mv /tmp/status.tmp /data/status
      sleep 5
    done
